name: ClearToShip
description: Pre-flight security check for AI-built apps, agents included. Blocks PRs on ungated agent tools, model output in a shell, missing Server Action auth, Supabase RLS holes, hallucinated packages and leaked keys.
author: ClearToShip
branding:
  icon: shield
  color: green

inputs:
  paths:
    description: Files or directories to scan, space-separated. Defaults to the whole project.
    required: false
    default: ''
  fail-on:
    description: Fail the job at or above this severity (critical, high, medium, low, none).
    required: false
    default: critical
  comment:
    description: Post (and update) a summary comment on the pull request. Requires pull-requests write permission.
    required: false
    default: 'true'
  sarif:
    description: Write results.sarif for upload to GitHub code scanning.
    required: false
    default: 'false'
  offline:
    description: Skip registry and OSV lookups.
    required: false
    default: 'false'
  version:
    description: >-
      Release of ClearToShip to run: a version number, `latest` for the newest
      release, or `local` to build from the checkout. Defaults to the version this
      action's own ref declares, so `uses: …@v0.13.8` runs 0.13.8.
    required: false
    default: ''
  working-directory:
    description: Directory to run the scan from.
    required: false
    default: '.'
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}

outputs:
  resolved:
    description: >-
      Which scanner actually ran: `release` (the standalone bundle from the
      GitHub release, no registry involved) or `checkout` (built from this
      action's own source). Tried in that order; the action works either way,
      and this says which.
    value: ${{ steps.resolve.outputs.resolved }}
  verdict:
    description: One of clear, conditional, or hold.
    value: ${{ steps.scan.outputs.verdict }}
  critical:
    description: Number of critical findings.
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: Number of high findings.
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: Number of medium findings.
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: Number of low findings.
    value: ${{ steps.scan.outputs.low }}
  total:
    description: Total number of findings.
    value: ${{ steps.scan.outputs.total }}
  blocking:
    description: Number of findings at or above the fail-on severity.
    value: ${{ steps.scan.outputs.blocking }}

runs:
  using: composite
  steps:
    - name: Resolve ClearToShip
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # With no version pinned, run the exact version this action's checkout
        # declares. That keeps the action ref and the scanner in lockstep:
        # pinning `uses: <owner>/cleartoship@vX.Y.Z` runs cleartoship@X.Y.Z
        # instead of whatever happens to be newest at the time. Written
        # without a literal version on purpose: this line has twice been left
        # stating the previous release during a bump.
        ver="$INPUT_VERSION"
        if [ -z "$ver" ]; then
          ver=$(node -p "require('${GITHUB_ACTION_PATH}/package.json').version")
          echo "No version pinned; matching this action's checkout: ${ver}"
        fi

        # There is no npm branch, on purpose. This project is not published on npm,
        # so a package named `cleartoship` on the registry is not ours, and running
        # one would execute whatever a stranger registered under an unclaimed name,
        # in a job that can hold a write token. The release asset is a single
        # bundled file with no dependencies, so it needs nothing but a download, and
        # the checkout build is this action's own source.
        #
        # `resolved` is reported because otherwise the fallback is invisible: the
        # Action works whichever path runs, which is the point, but a test claiming
        # "the release build is fine" could not tell it had graded something else.
        repo=$(node -p "require('${GITHUB_ACTION_PATH}/package.json').repository.url.replace(/^git\+/,'').replace(/\.git$/,'')")
        if [ "$ver" = "latest" ]; then
          asset="${repo}/releases/latest/download/cleartoship.mjs"
        else
          asset="${repo}/releases/download/v${ver}/cleartoship.mjs"
        fi
        bundle="${RUNNER_TEMP}/cleartoship-${ver}.mjs"

        if [ "$ver" = "local" ]; then
          echo "version: local - building from the action checkout."
          ( cd "$GITHUB_ACTION_PATH" && npm ci --silent && npm run build --silent )
          echo "cmd=node ${GITHUB_ACTION_PATH}/dist/cli.js" >> "$GITHUB_OUTPUT"
          echo "resolved=checkout" >> "$GITHUB_OUTPUT"
        elif curl -fsSL --retry 2 "$asset" -o "$bundle" && node "$bundle" --version >/dev/null 2>&1; then
          echo "cmd=node ${bundle}" >> "$GITHUB_OUTPUT"
          echo "resolved=release" >> "$GITHUB_OUTPUT"
          echo "Using the standalone bundle from release ${ver} - no registry involved."
        else
          echo "No release bundle for ${ver}; building from the checkout."
          ( cd "$GITHUB_ACTION_PATH" && npm ci --silent && npm run build --silent )
          echo "cmd=node ${GITHUB_ACTION_PATH}/dist/cli.js" >> "$GITHUB_OUTPUT"
          echo "resolved=checkout" >> "$GITHUB_OUTPUT"
        fi

    - name: Run ClearToShip
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Inputs are read through the environment rather than interpolated into
        # the script body, so a caller's value is never parsed as shell.
        CTS: ${{ steps.resolve.outputs.cmd }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -o pipefail
        args=()
        if [ -n "$INPUT_PATHS" ]; then read -ra args <<< "$INPUT_PATHS"; fi
        if [ "$INPUT_OFFLINE" = "true" ]; then args+=(--offline); fi

        # The gate is applied at the end so the report and comment are produced
        # regardless of pass/fail; --fail-on=none keeps this step from aborting early.
        $CTS "${args[@]}" --json --fail-on=none > cleartoship.json
        $CTS "${args[@]}" --markdown --fail-on=none > cleartoship.md || true
        if [ "$INPUT_SARIF" = "true" ]; then
          $CTS "${args[@]}" --sarif --fail-on=none > results.sarif || true
        fi

        # Counting blocking findings here — off the full report, which carries every
        # severity — is what makes `fail-on: medium` and `fail-on: low` mean what they
        # say. A gate rebuilt from the critical/high outputs alone silently cannot.
        # Fed to node over stdin with a quoted heredoc: nothing here is parsed by
        # bash, so an apostrophe in a comment cannot silently truncate the script.
        node <<'NODE'
        const fs = require("fs");
        const r = JSON.parse(fs.readFileSync("cleartoship.json", "utf8"));
        const rank = { critical: 4, high: 3, medium: 2, low: 1, info: 0 };
        const gate = process.env.INPUT_FAIL_ON;
        if (gate !== "none" && !(gate in rank)) {
          console.error(`::error::Unknown fail-on value "${gate}". Use critical, high, medium, low or none.`);
          process.exit(2);
        }
        const blocking = gate === "none"
          ? 0
          : r.findings.filter((f) => rank[f.severity] >= rank[gate]).length;
        // Written out one by one rather than in a loop, so every declared output
        // stays greppable and the action test can prove each one is produced.
        const out = process.env.GITHUB_OUTPUT;
        fs.appendFileSync(out, `verdict=${r.verdict}\n`);
        fs.appendFileSync(out, `critical=${r.counts.critical}\n`);
        fs.appendFileSync(out, `high=${r.counts.high}\n`);
        fs.appendFileSync(out, `medium=${r.counts.medium}\n`);
        fs.appendFileSync(out, `low=${r.counts.low}\n`);
        fs.appendFileSync(out, `total=${r.findings.length}\n`);
        fs.appendFileSync(out, `blocking=${blocking}\n`);
        NODE

        # Job summary — always shown on the run.
        cat cleartoship.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # A sticky comment: find a previous ClearToShip comment and edit it, so
        # re-runs update in place instead of piling up.
        marker="<!-- cleartoship -->"
        printf '%s\n\n' "$marker" > body.md
        cat cleartoship.md >> body.md

        id=$(gh api "repos/${REPO}/issues/${PR}/comments" \
              --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty" 2>/dev/null || true)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md >/dev/null
        else
          gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@body.md >/dev/null
        fi

    - name: Upload SARIF
      if: ${{ inputs.sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.working-directory }}/results.sarif

    - name: Apply severity gate
      shell: bash
      env:
        GATE: ${{ inputs.fail-on }}
        BLOCKING: ${{ steps.scan.outputs.blocking }}
      run: |
        if [ "$BLOCKING" -gt 0 ]; then
          echo "::error::ClearToShip found ${BLOCKING} finding(s) at or above '${GATE}'."
          exit 1
        fi
        echo "ClearToShip: clear to ship at '${GATE}'."
