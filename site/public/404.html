<!DOCTYPE html>

<style>
  :root {
    --bg: #0a0d12;
    --border-soft: #18202c;

  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6;

  }
  a { color: var(--green); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { border-bottom: 1px solid var(--border-soft); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; width: 100%; }
  .nav { display: flex; align-items: center; height: 60px; }
  .brand { font-weight: 650; font-size: 15px; color: inherit; }
  main { flex: 1; display: flex; align-items: center; }
  .code { font-family: var(--mono); color: var(--green); font-size: 13px; letter-spacing: 0.04em; margin: 0 0 10px; }
  h1 { font-size: 32px; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--ink-dim); max-width: 560px; margin: 0 0 8px; }

      <a href="https://github.com/murtazaozdemir/cleartoship/releases">GitHub</a>.</p>
  </div>
</main>
