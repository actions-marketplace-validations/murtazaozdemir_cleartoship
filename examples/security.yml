# Copy to .github/workflows/security.yml in your own repository.
#
# This uses the composite action: sticky PR comments and typed outputs. If you
# would rather depend on no action at all, examples/security-cli.yml does the
# same job with one downloaded file and `node`.
name: ClearToShip

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # for the summary comment
  security-events: write # for the optional SARIF upload

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cleartoship needs Node ^22.18 (Babel 8). Pin it rather than inheriting
      # whatever the runner image happens to ship this month.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: murtazaozdemir/cleartoship@v0.13.6
        with:
          fail-on: critical   # block the PR only on criticals
          comment: true        # post a summary comment on the PR
          sarif: true          # also upload to the Security tab
