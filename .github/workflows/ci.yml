name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a pull request, where only the latest push matters.
# Never on main: each commit there needs its own verdict, and a run cancelled by
# the next push leaves a commit with no signal at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Everything except the fixtures under test/, which are deliberately
      # vulnerable. Listed explicitly rather than scanning `src` alone: the
      # README, the manifests, the shipped Action and the landing page are all
      # part of what this publishes, and a self-scan that read none of them let
      # a false positive on this project's own README survive a release.
      - run: >-
          node dist/cli.js
          src site examples scripts .github
          action.yml package.json README.md SECURITY.md ATTRIBUTION.md TODO.md CLAUDE.md
          --fail-on=critical

  # A version that appears in prose drifts; one that is asserted does not.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docs must pin the version this repo declares
        run: |
          # action.yml resolves its own version without a literal, because that
          # line was twice left naming the previous release during a bump. Prose
          # cannot do that, so it is asserted instead.
          ver=$(node -p "require('./package.json').version")
          # Every version literal that names this package, wherever it appears:
          # `uses: …@vX`, and any release-download URL.
          bad=$(grep -ohE '(cleartoship@|cleartoship/releases/download/)v[0-9]+\.[0-9]+\.[0-9]+' \
                  examples/security.yml README.md \
                | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u | grep -vx "v${ver}" || true)
          if [ -n "$bad" ]; then
            echo "::error::docs name $(echo $bad) but package.json declares v${ver}"
            grep -nE '(cleartoship@|cleartoship/releases/download/)v[0-9]' examples/security.yml README.md
            exit 1
          fi
          echo "every version literal in the docs says v${ver}"
