name: Release

# Tagging is the release: a GitHub Release with the bundle attached, and
# cleartoship.app serving that same file. ClearToShip is not published on npm, so
# nothing here publishes to a registry. Publishing by hand is what let package.json
# reach 0.8.0 while the distributed build was still 0.7.0, so the version that
# ships must be the version in the tag.
#
# Two jobs, split by what they are trusted with:
#   build   — read-only token, no credentials left in the checkout. Installs,
#             tests, self-scans and produces the three assets.
#   publish — never checks out or runs the repository's code. It downloads the
#             built assets, signs build-provenance attestations for them, and
#             attaches them to the release. It holds the write token, and
#             `npm ci` (every dependency's install scripts) never runs beside it.
# The Action verifies those attestations (`gh attestation verify`) before it
# runs a downloaded bundle, and refuses one that does not verify.
on:
  push:
    tags: ['v*']

# Releases queue, never cancel. Interrupting one mid-flight is how you get a
# release with half its assets attached.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          }
          echo "releasing ${pkg}"

      # The shipped example pins a literal version, which is the line that has
      # twice been left naming the previous release during a bump. Same script
      # as ci.yml: README.md, examples/*.yml and site/public/*.html.
      - name: Docs must pin this version
        run: scripts/check-version-pins.sh

      - run: npm ci
      - run: npm run build
      - run: npm test
      # The fixtures under test/ are intentionally vulnerable; everything else
      # this publishes gets scanned, docs and manifests included. Online and
      # without --allow-incomplete, as in ci.yml: a release does not ship on a
      # scan that could not finish (exit 3). If npm or OSV is down, re-run.
      - run: >-
          node dist/cli.js
          src site examples scripts .github
          action.yml package.json README.md SECURITY.md ATTRIBUTION.md TODO.md CLAUDE.md
          --fail-on=critical

      - name: Build the release assets
        run: |
          # Three artifacts, and they are not the same thing.
          #
          # cleartoship-X.Y.Z.tgz is the full package (`npm pack`): the module tree
          # and the library API, for anyone who wants `import { scan }`. Its five
          # runtime dependencies are installed from the registry by whoever uses it.
          # `"private": true` in package.json blocks `npm publish`, not `npm pack`.
          #
          # cleartoship-standalone.tgz is one bundled file with no dependencies
          # at all, so it installs when the registry cannot resolve anything.
          # Its name carries no version on purpose, which makes
          # /releases/latest/download/cleartoship-standalone.tgz a permanent
          # install URL and keeps a version literal out of the README — the one
          # line that has repeatedly been left naming the previous release.
          #
          # cleartoship.mjs is that bundle as a bare file. npm 12 ships with
          # allow-remote and allow-git set to "none", so both tarball paths need
          # an explicit flag from the user; a file you curl and hand to node
          # needs no package manager to cooperate at all.
          mkdir -p release-assets
          tarball=$(npm pack --silent --pack-destination release-assets)
          npm run bundle
          packed=$(cd standalone && npm pack --silent)
          mv "standalone/${packed}" release-assets/cleartoship-standalone.tgz
          cp standalone/cleartoship.mjs release-assets/cleartoship.mjs
          ls -la release-assets
          test -f "release-assets/${tarball}"

      # Before anything is signed: the bundle must run and report this tag's
      # version, and carry the licence texts it is obliged to.
      - name: The bundle runs and reports this version
        run: |
          ver=$(node -p "require('./package.json').version")
          got=$(node release-assets/cleartoship.mjs --version)
          test "$got" = "$ver" || {
            echo "::error::the built bundle reports ${got}, but this tag declares ${ver}"
            exit 1
          }
          grep -q 'Apache License' release-assets/cleartoship.mjs || {
            echo "::error::the bundle is missing its embedded licence texts"
            exit 1
          }
          tar tzf release-assets/cleartoship-standalone.tgz | grep -q '^package/LICENSES/' || {
            echo "::error::cleartoship-standalone.tgz does not ship LICENSES/"
            exit 1
          }
          echo "bundle runs and reports ${got}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and attach assets
      id-token: write      # Sigstore signing for the provenance attestation
      attestations: write  # store the attestation on this repository
      actions: write       # dispatch the site deploy that serves this release
    steps:
      # Only for running the released bundle in the verify step below; no
      # repository code or dependency is installed in this job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      # What the Action checks before running a downloaded bundle: built by this
      # workflow, from this tag, on a GitHub-hosted runner.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/cleartoship.mjs
            release-assets/cleartoship-standalone.tgz
            release-assets/cleartoship-*.*.*.tgz

      # Assets go onto a DRAFT release, which is only published once every asset
      # is attached, so nobody can download a half-attached release — and so this
      # still works with immutable releases turned on, which forbid adding assets
      # to a published release.
      #
      # Re-running a tag stays possible without a new version number:
      #   - the release does not exist:  created as a draft, assets attached, published;
      #   - it is still a draft (an earlier run died): assets re-uploaded with
      #     --clobber, then published. Clobbering a draft replaces nothing anyone
      #     could have downloaded;
      #   - it is already published: nothing is replaced. The job passes only if
      #     the attached assets are byte-identical to this build, and otherwise
      #     fails. A published asset is something users have verified and pinned,
      #     so a different build ships under a new version, never over an old one.
      - name: Create the GitHub Release and attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          assets=(cleartoship-*.*.*.tgz cleartoship-standalone.tgz cleartoship.mjs)
          state=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          case "$state" in
            missing)
              gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
                --draft --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag
              ;;
            true)
              gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
              ;;
            false)
              mkdir -p ../published
              gh release download "${GITHUB_REF_NAME}" --dir ../published --clobber
              for a in "${assets[@]}"; do
                cmp -s "$a" "../published/$a" || {
                  echo "::error::${GITHUB_REF_NAME} is already published and its ${a} differs from this build. Published assets are never replaced; cut a new version."
                  exit 1
                }
              done
              echo "::notice::${GITHUB_REF_NAME} is already published with identical assets; nothing to do."
              exit 0
              ;;
          esac
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          echo "::notice::Released ${GITHUB_REF_NAME}."
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          echo "Runs with no package manager involved:"
          echo "  curl -fsSL ${base}/cleartoship.mjs -o cleartoship.mjs && gh attestation verify cleartoship.mjs -R ${GITHUB_REPOSITORY} && node cleartoship.mjs"

      # A green step is not a shipped artifact: check the release itself, the way a
      # consumer would. It must carry all three assets, the bundle attached to it
      # must verify against its provenance attestation, and it must run and report
      # the version this tag declares.
      - name: Verify the release carries a working, attested bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # The assets endpoint, not `gh release view`: a release's embedded asset
          # list read back empty for about two minutes after v0.13.11 was
          # published, while the assets endpoint and the download URLs had them.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)
          have=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --jq '.[] | select(.state == "uploaded") | .name')
          for asset in "cleartoship-${ver}.tgz" cleartoship-standalone.tgz cleartoship.mjs; do
            echo "$have" | grep -qx "$asset" || {
              echo "::error::release ${GITHUB_REF_NAME} is missing the asset ${asset}"
              exit 1
            }
          done
          rm -f "${RUNNER_TEMP}/released.mjs"
          curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/cleartoship.mjs" \
            -o "${RUNNER_TEMP}/released.mjs"
          gh attestation verify "${RUNNER_TEMP}/released.mjs" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "refs/tags/${GITHUB_REF_NAME}" \
            --deny-self-hosted-runners
          got=$(node "${RUNNER_TEMP}/released.mjs" --version)
          test "$got" = "$ver" || {
            echo "::error::the released bundle reports ${got}, but this tag declares ${ver}"
            exit 1
          }
          echo "::notice::${GITHUB_REF_NAME} carries an attested bundle that runs and reports ${got}."

      # The site fetches this release's standalone build at deploy time, and only for
      # the exact version package.json declares, so it has to be redeployed once the
      # release exists. deploy-site.yml then compares the served file's hash with the
      # release asset.
      - name: Redeploy the site so cleartoship.app serves this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-site.yml --ref main
