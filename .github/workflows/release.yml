name: Release

# Tagging is the release: a GitHub Release with the bundle attached, and
# cleartoship.app serving that same file. ClearToShip is not published on npm, so
# nothing here publishes to a registry. Publishing by hand is what let package.json
# reach 0.8.0 while the distributed build was still 0.7.0, so the version that
# ships must be the version in the tag.
on:
  push:
    tags: ['v*']

# Releases queue, never cancel. Interrupting one mid-flight is how you get a
# release with half its assets attached.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # for the GitHub Release
  actions: write    # to dispatch the site deploy that serves this release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          }
          # The shipped example pins a literal version, which is the line that
          # has twice been left naming the previous release during a bump.
          bad=$(grep -ohE '(cleartoship@|cleartoship/releases/download/)v[0-9]+\.[0-9]+\.[0-9]+' \
                  examples/security.yml README.md \
                | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u | grep -vx "v${pkg}" || true)
          if [ -n "$bad" ]; then
            echo "::error::docs name $(echo $bad) but package.json declares v${pkg}"
            exit 1
          fi
          echo "releasing ${pkg}"

      - run: npm ci
      - run: npm run build
      - run: npm test
      # The fixtures under test/ are intentionally vulnerable; everything else
      # this publishes gets scanned, docs and manifests included.
      - run: >-
          node dist/cli.js
          src site examples scripts .github
          action.yml package.json README.md SECURITY.md ATTRIBUTION.md TODO.md
          --fail-on=critical

      # Idempotent, so a tag can be re-run without a new version number:
      # `gh release create` on an existing release is an error, so an existing one
      # gets its assets re-uploaded instead.
      - name: Create the GitHub Release and attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two artifacts, and they are not the same thing.
          #
          # cleartoship-X.Y.Z.tgz is the full package (`npm pack`): the module tree
          # and the library API, for anyone who wants `import { scan }`. Its five
          # runtime dependencies are installed from the registry by whoever uses it.
          #
          # cleartoship-standalone.tgz is one bundled file with no dependencies
          # at all, so it installs when the registry cannot resolve anything.
          # Its name carries no version on purpose, which makes
          # /releases/latest/download/cleartoship-standalone.tgz a permanent
          # install URL and keeps a version literal out of the README — the one
          # line that has repeatedly been left naming the previous release.
          tarball=$(npm pack --silent)
          npm run bundle
          packed=$(cd standalone && npm pack --silent)
          mv "standalone/${packed}" cleartoship-standalone.tgz
          ls -la "${tarball}" cleartoship-standalone.tgz

          # And the bundle as a bare file. npm 12 ships with allow-remote and
          # allow-git set to "none", so both tarball paths now need an explicit
          # flag from the user; a file you curl and hand to node needs no
          # package manager to cooperate at all.
          cp standalone/cleartoship.mjs cleartoship.mjs

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${tarball}" cleartoship-standalone.tgz cleartoship.mjs --clobber
            echo "::notice::Updated release ${GITHUB_REF_NAME}."
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${tarball}" cleartoship-standalone.tgz cleartoship.mjs \
              --generate-notes --title "${GITHUB_REF_NAME}"
            echo "::notice::Released ${GITHUB_REF_NAME}."
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          echo "Runs with no package manager involved:"
          echo "  curl -fsSL ${base}/cleartoship.mjs -o cleartoship.mjs && node cleartoship.mjs"

      # A green step is not a shipped artifact: check the release itself. It must carry
      # all three assets, and the bundle attached to it must run and report the version
      # this tag declares. This replaces the old registry check, which asked the same
      # question of a place that is no longer part of the release.
      - name: Verify the release carries a working bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "require('./package.json').version")
          have=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for asset in "cleartoship-${ver}.tgz" cleartoship-standalone.tgz cleartoship.mjs; do
            echo "$have" | grep -qx "$asset" || {
              echo "::error::release ${GITHUB_REF_NAME} is missing the asset ${asset}"
              exit 1
            }
          done
          rm -f "${RUNNER_TEMP}/released.mjs"
          gh release download "${GITHUB_REF_NAME}" --pattern cleartoship.mjs --output "${RUNNER_TEMP}/released.mjs"
          got=$(node "${RUNNER_TEMP}/released.mjs" --version)
          test "$got" = "$ver" || {
            echo "::error::the released bundle reports ${got}, but this tag declares ${ver}"
            exit 1
          }
          echo "::notice::${GITHUB_REF_NAME} carries a bundle that runs and reports ${got}."

      # The site fetches this release's standalone build at deploy time, and only for
      # the exact version package.json declares, so it has to be redeployed once the
      # release exists. deploy-site.yml then compares the served file's hash with the
      # release asset.
      - name: Redeploy the site so cleartoship.app serves this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
