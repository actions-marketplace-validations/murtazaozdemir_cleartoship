name: Deploy site

# Ongoing deploys of the cleartoship.app landing page.
#
# This replaces Cloudflare's native Workers Builds git integration, which broke
# when the repository was deleted and recreated: that integration is an OAuth
# link to a repository *object*, so it does not survive one. This does — it is a
# file in the repo plus two secrets, it is visible in the diff, and it can be
# re-established from a clone.
#
# It does NOT perform the one-time custom-domain binding. That placeholder DNS
# record has to be cleared once by hand in the Cloudflare dashboard (error
# 100117). Once the domain is bound, every push touching site/ redeploys.
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

# Two pushes in quick succession must not race to deploy the same Worker.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      # Fail here, loudly, rather than at the deploy step with a wall of output.
      # A token missing "Workers Scripts: Edit" is the likely cause.
      - name: Check the Cloudflare token before deploying anything
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set on this repository."
            exit 1
          fi
          npx wrangler whoami || {
            echo "::error::The Cloudflare token was rejected. It needs Workers Scripts -> Edit on this account."
            exit 1
          }

      # Retried, with wrangler's answer kept in the log. This used to be one read with
      # stderr thrown away, and a single empty answer from the Cloudflare API is
      # indistinguishable from "there is no version" — see the confirm step below.
      - name: Record the live version before deploying
        id: before
        run: |
          v=""
          for attempt in 1 2 3; do
            out=$(npx wrangler deployments list --name cleartoship 2>&1) || true
            v=$(echo "$out" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tail -1 || true)
            [ -n "$v" ] && break
            echo "attempt ${attempt}: wrangler returned no version:"; echo "$out" | tail -5
            sleep 4
          done
          echo "Live version before deploy: ${v:-none}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The install path that does not depend on npm: the standalone build is served
      # from this domain, so `curl -fsSL https://cleartoship.app/cleartoship.mjs`
      # works with nothing else in the loop.
      #
      # Fetched from the GitHub Release at deploy time rather than committed, and
      # ONLY when a release exists for the exact version this commit declares.
      # Serving "whatever is latest" would hand out a build that does not match
      # this source. With no matching release the site simply deploys without the
      # files, and release.yml redeploys once the release exists.
      - name: Fetch this version's standalone build into the site
        id: dist
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "require('./package.json').version")
          tag="v${ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --dir site/public \
              --pattern cleartoship.mjs --pattern cleartoship-standalone.tgz --clobber
            (cd site/public && sha256sum cleartoship.mjs cleartoship-standalone.tgz > SHA256SUMS)
            echo "served=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Serving the ${tag} standalone build from the site."
          else
            echo "served=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release ${tag} yet, so the site deploys without the download files. release.yml redeploys once it exists."
          fi

      - name: Deploy to Cloudflare
        # Pinned to a commit: this step holds the Cloudflare token, and a
        # mutable tag can be re-pointed at code that reads it. Dependabot's
        # github-actions ecosystem keeps the SHA current.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      # A green push is not a deploy. Both aistoreaudit outages looked like a
      # passing job: once GitHub billing killed the run before it started, once
      # a missing token failed it in 8s, and both times production quietly served
      # a stale build for days. So this does not merely print the version — it
      # compares, and fails the job if the live Worker did not actually move.
      #
      # Read back with retries, not once: the deploy on 265fded printed "Success" and a
      # new Version ID, then this step asked `wrangler deployments list` one second
      # later, got nothing back, and failed a good deploy. A read that comes back empty,
      # or still shows the old version, has not yet proved anything either way; keep
      # asking, show what wrangler said, and only fail if it never settles.
      - name: Confirm the live version actually changed
        run: |
          before="${{ steps.before.outputs.version }}"
          after=""
          for attempt in 1 2 3 4 5 6; do
            out=$(npx wrangler deployments list --name cleartoship 2>&1) || true
            after=$(echo "$out" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tail -1 || true)
            if [ -n "$after" ] && { [ -z "$before" ] || [ "$after" != "$before" ]; }; then break; fi
            echo "attempt ${attempt}: not settled yet (read '${after:-nothing}'). wrangler said:"; echo "$out" | tail -5
            sleep 5
          done
          echo "before: ${before:-none}"
          echo "after:  ${after:-none}"
          if [ -z "$after" ]; then
            echo "::error::Could not read the live version back. Treating as a failed deploy."
            exit 1
          fi
          if [ -n "$before" ] && [ "$before" = "$after" ]; then
            echo "::error::The live Worker version did not change ($after). The job was green but nothing shipped."
            exit 1
          fi
          echo "::notice::Landing page deployed. Live version is now $after."

      # Same rule as above, applied to the thing this step exists to publish: the
      # deploy being green proves nothing about what the domain serves. Fetch it
      # back and compare it byte for byte with the release asset.
      - name: Confirm the domain serves exactly the release build
        if: steps.dist.outputs.served == 'true'
        run: |
          want=$(grep ' cleartoship.mjs$' public/SHA256SUMS | cut -d' ' -f1)
          got=""
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -fsSL -H 'Cache-Control: no-cache' https://cleartoship.app/cleartoship.mjs | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "::notice::cleartoship.app/cleartoship.mjs matches the release asset (sha256 $want)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::cleartoship.app/cleartoship.mjs does not match the release asset. Wanted $want, got ${got:-nothing}."
          exit 1
