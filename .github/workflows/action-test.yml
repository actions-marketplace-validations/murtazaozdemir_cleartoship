name: Action integration test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a pull request, where only the latest push matters.
# Never on main: each commit there needs its own verdict, and a run cancelled by
# the next push leaves a commit with no signal at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The vulnerable fixture must make the action fail and surface findings.
  detects-vulnerable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: scan
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixtures/vulnerable-app
          offline: 'true'
          comment: 'false'
          version: local
      - name: Assert it flagged the fixture and failed
        run: |
          test "${{ steps.scan.outcome }}" = "failure" || { echo "expected the gate to fail"; exit 1; }
          test "${{ steps.scan.outputs.verdict }}" = "hold" || { echo "expected verdict=hold, got ${{ steps.scan.outputs.verdict }}"; exit 1; }
          test "${{ steps.scan.outputs.critical }}" -gt 0 || { echo "expected criticals"; exit 1; }
          echo "vulnerable fixture: verdict=${{ steps.scan.outputs.verdict }} critical=${{ steps.scan.outputs.critical }}"

  # The clean fixture must pass with no findings.
  passes-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: scan
        uses: ./
        with:
          working-directory: test/fixtures/clean-app
          offline: 'true'
          comment: 'false'
          version: local
      - name: Assert it is clear
        run: |
          test "${{ steps.scan.outputs.verdict }}" = "clear" || { echo "expected verdict=clear"; exit 1; }
          test "${{ steps.scan.outputs.total }}" = "0" || { echo "expected zero findings, got ${{ steps.scan.outputs.total }}"; exit 1; }
          echo "clean fixture: clear to ship"

  # The path real consumers actually take: the published npm package, plus the
  # sticky PR comment. Neither is covered by the jobs above — they pin
  # `version: local`, and the comment step only fires on pull_request — so a
  # broken publish or a broken comment would have looked green indefinitely.
  published-and-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the sticky comment; the repo default is read-only
    steps:
      - uses: actions/checkout@v7
      - id: scan
        uses: ./
        with:
          working-directory: test/fixtures/clean-app
          offline: 'true'
          comment: 'true'
          version: latest
      # npm is an optional backup channel, so this canary only runs once it is
      # switched on (`gh variable set PUBLISH_TO_NPM --body true`, the same switch
      # release.yml uses). Left unconditional it failed every pull request while the
      # package is off the registry — and it runs `npx --yes cleartoship@latest`,
      # which executes whatever the registry serves under that name. While the name
      # is unclaimed, anyone who registers it would get code execution in this job,
      # which holds `pull-requests: write`.
      - name: Assert the published package is installable at all
        if: vars.PUBLISH_TO_NPM == 'true'
        run: |
          # Asked directly rather than through the action, because the action now
          # prefers the release bundle and would no longer touch npm on a healthy
          # run. This is the canary for `npx cleartoship`, which is a documented
          # install path whether or not the action uses it — and which is exactly
          # what was quietly broken while this job reported success.
          npx --yes cleartoship@latest --version || {
            echo "::error::npx cleartoship@latest does not run. The package is not"
            echo "::error::installable from the registry, which breaks a documented"
            echo "::error::install path even though the Action itself is unaffected."
            exit 1
          }

      - name: Assert the published package returns a clean verdict
        run: |
          test "${{ steps.scan.outputs.verdict }}" = "clear" || {
            echo "published cleartoship@latest did not report the clean fixture as clear"
            echo "verdict=${{ steps.scan.outputs.verdict }} total=${{ steps.scan.outputs.total }}"
            exit 1
          }
          echo "published package: clear to ship"
      - name: Assert the sticky comment landed exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Exactly one: a second comment would mean the sticky edit path broke
          # and re-runs are piling up instead of updating in place.
          n=$(gh api "repos/${REPO}/issues/${PR}/comments" \
                --jq 'map(select(.body | contains("<!-- cleartoship -->"))) | length')
          test "$n" = "1" || { echo "expected 1 ClearToShip comment, found ${n}"; exit 1; }
          echo "sticky comment present, count=${n}"
