<svg xmlns="http://www.w3.org/2000/svg" width="888" height="1016" viewBox="0 0 888 1016" role="img" aria-label="ClearToShip scanning a deliberately vulnerable Next.js and Supabase app: hallucinated packages, missing Server Action auth, Row Level Security disabled">
<rect width="888" height="1016" rx="10" fill="#0b0f14"/>
<rect width="888" height="30" rx="10" fill="#151b23"/><rect y="20" width="888" height="10" fill="#151b23"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f56"/><circle cx="38" cy="15" r="5.5" fill="#ffbd2e"/><circle cx="58" cy="15" r="5.5" fill="#27c93f"/>
<text x="444" y="19" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e">cleartoship — pre-flight</text>
<text x="20" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [1/7] Dependency hallucination &amp; slopsquatting…</tspan></text>
<text x="20" y="61" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [2/7] Next.js Server Actions &amp; Route Handlers…</tspan></text>
<text x="20" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [3/7] Supabase / PostgreSQL Row Level Security…</tspan></text>
<text x="20" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [4/7] Secrets &amp; client-bundle boundary…</tspan></text>
<text x="20" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [5/7] Logging, exception-handling &amp; deserialization…</tspan></text>
<text x="20" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [6/7] LLM &amp; agent risk (prompt injection, excessive agency, output handling)…</tspan></text>
<text x="20" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  [7/7] Community ruleset (435 rules)…</tspan></text>
<text x="20" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">──────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="20" y="197" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">  </tspan><tspan fill="#d1d5db" font-weight="700">SCAN FINDINGS</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#6b7280">(</tspan><tspan fill="#f87171" font-weight="700">19 critical</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#f87171">12 high</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#facc15">5 medium</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#60a5fa">45 low</tspan><tspan fill="#6b7280">)</tspan></text>
<text x="20" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">──────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="20" y="231" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">  </tspan><tspan fill="#f87171" font-weight="700">✖ CRITICAL</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#d1d5db" font-weight="700">Dependency does not exist on the registry</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#6b7280">CTS020</tspan></text>
<text x="20" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">at</tspan><tspan fill="#d1d5db"> </tspan><tspan fill="#22d3ee">test/fixtures/vulnerable-app/AGENTS.md:7</tspan></text>
<text x="20" y="282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    `supabase-auth-helpers-nextjs` is referenced by an install command</tspan></text>
<text x="20" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    in test/fixtures/vulnerable-app/AGENTS.md but no such package is</tspan></text>
<text x="20" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    published on npm. This is the classic signature of an</tspan></text>
<text x="20" y="333" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    AI-hallucinated import. The name is unclaimed, so an attacker can</tspan></text>
<text x="20" y="350" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    register it and have their code execute in every install and CI run</tspan></text>
<text x="20" y="367" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    from then on.</tspan></text>
<text x="20" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#4ade80">→ Remove `supabase-auth-helpers-nextjs` and the code that imports</tspan></text>
<text x="20" y="401" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    it, or publish the package yourself to claim the name.</tspan></text>
<text x="20" y="418" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">A03:2025 - Software Supply Chain Failures</tspan><tspan fill="#6b7280"> · CWE-1357: Reliance on Insufficiently Trustworthy Component</tspan></text>
<text x="20" y="435" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="452" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">  </tspan><tspan fill="#f87171" font-weight="700">✖ CRITICAL</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#d1d5db" font-weight="700">Missing Server Action authorization</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#6b7280">CTS001</tspan></text>
<text x="20" y="469" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">at</tspan><tspan fill="#d1d5db"> </tspan><tspan fill="#22d3ee">test/fixtures/vulnerable-app/app/actions/admin.ts:9</tspan></text>
<text x="20" y="486" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">│</tspan><tspan fill="#d1d5db"> </tspan><tspan fill="#6b7280">await admin.from('profiles').update({ is_admin: true }).eq('email', email)</tspan></text>
<text x="20" y="503" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    Server Action `grantAdmin` performs a database mutation without</tspan></text>
<text x="20" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    verifying the caller. Server Actions compile to public HTTP POST</tspan></text>
<text x="20" y="537" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    endpoints — anyone can invoke this by ID, the UI is not a gate.</tspan></text>
<text x="20" y="554" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#4ade80">→ Resolve and check the session before touching the database, e.g.</tspan></text>
<text x="20" y="571" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">      const { data: { user } } = await supabase.auth.getUser()</tspan></text>
<text x="20" y="588" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">      if (!user) throw new Error('Unauthorized')</tspan></text>
<text x="20" y="605" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    then scope the write to that user. A wrapper such as</tspan></text>
<text x="20" y="622" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    next-safe-action’s `authActionClient` also satisfies this check.</tspan></text>
<text x="20" y="639" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">A01:2025 - Broken Access Control</tspan><tspan fill="#6b7280"> · CWE-306: Missing Authentication for Critical Function</tspan></text>
<text x="20" y="656" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="673" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">  </tspan><tspan fill="#f87171" font-weight="700">✖ CRITICAL</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#d1d5db" font-weight="700">Public table with Row Level Security disabled</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#6b7280">CTS010</tspan></text>
<text x="20" y="690" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">at</tspan><tspan fill="#d1d5db"> </tspan><tspan fill="#22d3ee">test/fixtures/vulnerable-app/supabase/migrations/20260101000000_init.sql:16</tspan></text>
<text x="20" y="707" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">│</tspan><tspan fill="#d1d5db"> </tspan><tspan fill="#6b7280">create table public.audit_log (</tspan></text>
<text x="20" y="724" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    Table `public.audit_log` is in the schema PostgREST exposes, and RLS</tspan></text>
<text x="20" y="741" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    was never enabled on it. Every row is readable — and writable — by</tspan></text>
<text x="20" y="758" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    anyone holding the anon key, which ships in your client bundle.</tspan></text>
<text x="20" y="775" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#4ade80">→ ALTER TABLE "audit_log" ENABLE ROW LEVEL SECURITY;</tspan></text>
<text x="20" y="792" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    Then add a policy scoping rows to `auth.uid()`.</tspan></text>
<text x="20" y="809" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">    </tspan><tspan fill="#6b7280">A01:2025 - Broken Access Control</tspan><tspan fill="#6b7280"> · CWE-1220: Insufficient Granularity of Access Control</tspan></text>
<text x="20" y="826" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="843" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  … and the rest of the findings</tspan></text>
<text x="20" y="860" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="877" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">──────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="20" y="894" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">  </tspan><tspan fill="#f87171" font-weight="700">VERDICT: 🔴 HOLD — resolve the critical findings before deploying</tspan></text>
<text x="20" y="911" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">──────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="20" y="928" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6b7280">  26 files · 2.4s</tspan></text>
<text x="20" y="945" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="962" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"></text>
<text x="20" y="979" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#d1d5db">  </tspan><tspan fill="#6b7280">Hand the fixes to your AI editor:</tspan><tspan fill="#d1d5db">  </tspan><tspan fill="#22d3ee">re-run with --fix-prompt</tspan></text>
</svg>
